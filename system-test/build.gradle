plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.optivem.atddaccelerator.eshop.systemtest'
version = '0.0.1-SNAPSHOT'
description = 'ATDD Accelerator eShop - System Test'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'com.microsoft.playwright:playwright:1.44.0'
	testImplementation 'com.fasterxml.jackson.core:jackson-databind'
	testImplementation 'org.yaml:snakeyaml:2.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.github.optivem:atdd-commons-java:v1.0.1'

	testImplementation 'org.projectlombok:lombok:1.18.38'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    testImplementation 'org.junit.platform:junit-platform-suite-api:1.11.3'
    testImplementation 'org.junit.platform:junit-platform-suite-engine:1.11.3'
}

tasks.named('test') {
	useJUnitPlatform()

	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}
